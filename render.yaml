services:
  - type: web
    name: gate-pyq-backend
    runtime: node
    buildCommand: npm ci && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
